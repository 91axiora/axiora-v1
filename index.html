<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>AXIORA — Name & Crystal Calculator</title>

<style>
*{box-sizing:border-box}

body{
margin:0;
font-family:Arial,Helvetica,sans-serif;
background:
radial-gradient(circle at top,#172b46 0,#07111f 45%,#030811 100%);
color:#fff;
min-height:100vh;
}

.container{
width:100%;
max-width:680px;
margin:auto;
padding:28px 18px 50px;
}

.logo{
text-align:center;
font-size:46px;
font-weight:800;
letter-spacing:7px;
margin-top:10px;
}

.tagline{
text-align:center;
color:#9eacbf;
font-size:14px;
margin-top:7px;
margin-bottom:30px;
letter-spacing:1px;
}

.card{
background:rgba(16,29,46,.88);
border:1px solid rgba(137,170,207,.22);
border-radius:22px;
padding:24px;
margin-bottom:18px;
box-shadow:0 18px 45px rgba(0,0,0,.22);
}

label{
display:block;
font-size:14px;
font-weight:700;
color:#b8c7d9;
margin-bottom:9px;
}

input{
width:100%;
padding:16px;
border-radius:13px;
border:1px solid #3a506d;
background:#07111f;
color:#fff;
font-size:18px;
outline:none;
}

input:focus{
border-color:#55d6b1;
}

button{
width:100%;
padding:16px;
margin-top:15px;
border:0;
border-radius:13px;
background:linear-gradient(135deg,#55e0bb,#22b88d);
color:#04151a;
font-size:17px;
font-weight:800;
cursor:pointer;
}

button:active{
transform:scale(.99);
}

.error{
color:#ff8d8d;
text-align:center;
font-size:14px;
margin-top:12px;
}

.result{
display:none;
}

.result.show{
display:block;
}

.name{
text-align:center;
font-size:29px;
font-weight:800;
letter-spacing:2px;
}

.label{
text-align:center;
color:#8fa3bb;
font-size:12px;
text-transform:uppercase;
letter-spacing:2px;
margin-top:20px;
}

.letters{
text-align:center;
font-size:18px;
line-height:2;
margin-top:7px;
color:#e9f0f7;
}

.numbers{
text-align:center;
font-size:19px;
line-height:2;
margin-top:4px;
color:#74e3c1;
word-break:break-word;
}

.total{
text-align:center;
font-size:38px;
font-weight:900;
margin-top:8px;
}

.reduced{
text-align:center;
font-size:22px;
color:#74e3c1;
font-weight:700;
margin-top:4px;
}

.energy{
text-align:center;
font-size:28px;
font-weight:800;
margin-top:14px;
}

.energyDesc{
text-align:center;
color:#aebdce;
margin-top:7px;
line-height:1.5;
}

.crystal{
margin-top:20px;
padding:18px;
border-radius:16px;
background:rgba(8,17,29,.8);
border:1px solid rgba(116,227,193,.18);
}

.crystalTitle{
text-align:center;
color:#74e3c1;
font-size:12px;
letter-spacing:2px;
text-transform:uppercase;
font-weight:800;
}

.crystalName{
text-align:center;
font-size:23px;
font-weight:800;
margin-top:8px;
}

.crystalReason{
text-align:center;
color:#aebdce;
line-height:1.5;
margin-top:7px;
}

.reset{
background:#17283d;
color:#dce7f3;
border:1px solid #334b67;
}

.footer{
text-align:center;
color:#65778c;
font-size:12px;
margin-top:24px;
}
</style>
</head>

<body>

<div class="container">

<div class="logo">AXIORA</div>

<div class="tagline">
NAME • ENERGY • CRYSTAL
</div>

<div class="card">

<label for="nameInput">Enter Name</label>

<input
id="nameInput"
type="text"
autocomplete="off"
placeholder="Example: NANDOO"
>

<button onclick="calculate()">
Calculate
</button>

<div id="error" class="error"></div>

</div>


<div id="result" class="card result">

<div id="displayName" class="name"></div>

<div class="label">Letter Calculation</div>
<div id="displayLetters" class="letters"></div>

<div class="label">AXIORA Values</div>
<div id="displayNumbers" class="numbers"></div>

<div class="label">Total</div>
<div id="displayTotal" class="total"></div>

<div class="label">AXIORA Number</div>
<div id="displayReduced" class="reduced"></div>

<div class="label">Energy</div>
<div id="displayEnergy" class="energy"></div>

<div id="displayEnergyDesc" class="energyDesc"></div>

<div class="crystal">

<div class="crystalTitle">
AXIORA Crystal Suggestion
</div>

<div id="displayCrystal" class="crystalName"></div>

<div id="displayCrystalReason" class="crystalReason"></div>

</div>

<button class="reset" onclick="resetCalculator()">
Calculate Another Name
</button>

</div>

<div class="footer">
AXIORA • Internal calculation system
</div>

</div>


<script>

/* =====================================================
   AXIORA OFFICIAL ALPHABET MATRIX
   ===================================================== */

const AXIORA = {
A:1,
B:5,
C:8,
D:2,
E:9,
F:4,
G:7,
H:3,
I:6,
J:8,
K:1,
L:5,
M:9,
N:2,
O:6,
P:4,
Q:7,
R:3,
S:8,
T:1,
U:5,
V:2,
W:9,
X:6,
Y:7,
Z:4
};


/* =====================================================
   AXIORA ENERGY MATRIX
   ===================================================== */

const ENERGY = {
1:{
name:"Pioneer",
desc:"Initiative, leadership and independent drive."
},

2:{
name:"Harmony",
desc:"Balance, cooperation and relationship energy."
},

3:{
name:"Creator",
desc:"Creativity, expression and communication."
},

4:{
name:"Builder",
desc:"Structure, stability, discipline and practical action."
},

5:{
name:"Explorer",
desc:"Freedom, movement, curiosity and exploration."
},

6:{
name:"Nurturer",
desc:"Care, responsibility, harmony and support."
},

7:{
name:"Seeker",
desc:"Knowledge, introspection and deeper understanding."
},

8:{
name:"Achiever",
desc:"Achievement, authority, ambition and material strength."
},

9:{
name:"Visionary",
desc:"Vision, compassion and higher-purpose energy."
}
};


/* =====================================================
   AXIORA CRYSTAL RECOMMENDATIONS
   Only confirmed mappings are automated here.
   ===================================================== */

const CRYSTALS = {

1:{
name:"AXIORA Crystal Mapping Pending",
reason:"The AXIORA crystal assignment for Number 1 is not being guessed."
},

2:{
name:"AXIORA Crystal Mapping Pending",
reason:"The AXIORA crystal assignment for Number 2 is not being guessed."
},

3:{
name:"AXIORA Crystal Mapping Pending",
reason:"The AXIORA crystal assignment for Number 3 is not being guessed."
},

4:{
name:"Tiger's Eye • Green Aventurine • Clear Quartz",
reason:"Previously established AXIORA recommendation set for Number 4."
},

5:{
name:"Tiger's Eye • Citrine • Clear Quartz",
reason:"Previously established AXIORA recommendation set for Number 5."
},

6:{
name:"AXIORA Crystal Mapping Pending",
reason:"The AXIORA crystal assignment for Number 6 is not being guessed."
},

7:{
name:"AXIORA Crystal Mapping Pending",
reason:"The AXIORA crystal assignment for Number 7 is not being guessed."
},

8:{
name:"Black Tourmaline • Citrine • Smoky Quartz",
reason:"Previously established AXIORA recommendation set for Number 8."
},

9:{
name:"Amethyst • Rose Quartz • Clear Quartz",
reason:"Previously established AXIORA recommendation set for Number 9."
}

};


/* =====================================================
   REDUCE NUMBER
   ===================================================== */

function reduceNumber(number){

while(number > 9){

let digits =
String(number).split("");

number =
digits.reduce(
(sum,digit)=>sum + Number(digit),
0
);

}

return number;
}


/* =====================================================
   CALCULATE
   ===================================================== */

function calculate(){

const raw =
document
.getElementById("nameInput")
.value
.trim();

const name =
raw
.toUpperCase()
.replace(/[^A-Z]/g,"");

const error =
document.getElementById("error");

if(!name){

error.textContent =
"Please enter a valid English name.";

document
.getElementById("result")
.classList.remove("show");

return;
}


let total = 0;

let letterParts = [];

let numberParts = [];


for(const letter of name){

const value =
AXIORA[letter];

if(value === undefined){
continue;
}

total += value;

letterParts.push(letter);

numberParts.push(value);

}


/* REDUCTION */

const reduced =
reduceNumber(total);


/* ENERGY */

const energy =
ENERGY[reduced];


/* CRYSTAL */

const crystal =
CRYSTALS[reduced];


/* DISPLAY */

document
.getElementById("displayName")
.textContent = name;


document
.getElementById("displayLetters")
.textContent =
letterParts.join("  •  ");


document
.getElementById("displayNumbers")
.textContent =
numberParts.join(" + ");


document
.getElementById("displayTotal")
.textContent =
total;


document
.getElementById("displayReduced")
.textContent =
reduced;


document
.getElementById("displayEnergy")
.textContent =
reduced + " — " + energy.name;


document
.getElementById("displayEnergyDesc")
.textContent =
energy.desc;


document
.getElementById("displayCrystal")
.textContent =
crystal.name;


document
.getElementById("displayCrystalReason")
.textContent =
crystal.reason;


error.textContent = "";


document
.getElementById("result")
.classList.add("show");

}


/* =====================================================
   RESET
   ===================================================== */

function resetCalculator(){

document
.getElementById("nameInput")
.value = "";

document
.getElementById("result")
.classList.remove("show");

document
.getElementById("error")
.textContent = "";

window.scrollTo({
top:0,
behavior:"smooth"
});

}

</script>

</body>
</html>
