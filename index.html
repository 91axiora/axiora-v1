<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>AXIORA</title><style>
body{margin:0;background:#07111f;color:white;font-family:Arial}main{max-width:720px;margin:auto;padding:24px}.card{margin-top:8vh;padding:28px;border:1px solid #294d6b;border-radius:20px;background:#0d2035}.logo{color:#52b6ff;letter-spacing:6px;font-weight:bold}button{padding:14px 18px;margin:6px;border:0;border-radius:10px;background:#183b5a;color:white;font-size:16px}button.sel,button.primary{background:#2699f5}.bar{height:7px;background:#19354d;margin:10px 0}.bar i{display:block;height:100%;background:#2699f5}.q{font-size:21px;line-height:1.5;margin:30px 0}.note{padding:12px;background:#182637;border-radius:10px;color:#b9c8d6}</style></head><body><main><div class="card" id="app"></div></main><script>
const qs=Array.from({length:35},(_,i)=>"AXIORA Question "+(i+1)+": ఈ statement నాకు ఎంతవరకు సరిపోతుంది?");
const names=["Analytical","Creative","Leadership","Communication","Support","Systems","Adaptability"];let a=Array(35).fill(null),i=0,A=document.getElementById("app");
function home(){A.innerHTML='<div class="logo">AXIORA</div><h1>Discover Your Natural Strength Profile.</h1><p>35 questions · 7 dimensions · AXIORA V1.0 Prototype</p><button class="primary" onclick="start()">Start Assessment</button>'}
function start(){a.fill(null);i=0;show()}
function show(){A.innerHTML='<div class="logo">AXIORA</div><p>Question '+(i+1)+' / 35</p><div class="bar"><i style="width:'+((i+1)/35*100)+'%"></i></div><div class="q">'+qs[i]+'</div>'+[1,2,3,4,5].map(v=>'<button class="'+(a[i]==v?'sel':'')+'" onclick="pick('+v+')">'+v+'</button>').join('')+'<br><button class="primary" '+(a[i]==null?'disabled':'')+' onclick="next()">'+(i==34?'Analyze My Profile':'Next →')+'</button>'}
function pick(v){a[i]=v;show()}function next(){if(a[i]==null)return;if(i<34){i++;show()}else result()}
function result(){let s={};for(let f=0;f<7;f++){let raw=a.slice(f*5,f*5+5).reduce((x,y)=>x+y,0);s[names[f]]=(raw-5)/20*100}let v=Object.values(s),avg=v.reduce((x,y)=>x+y,0)/7,sd=Math.sqrt(v.reduce((x,y)=>x+(y-avg)**2,0)/7),f8=avg*(.6+.4*Math.max(0,100-2.5*sd)/100),r=Object.entries(s).sort((x,y)=>y[1]-x[1]),c=r[0][1]>=60?"Primary":"Insufficient";if(v.every(x=>x>=60)&&Math.max(...v)-Math.min(...v)<=15&&f8>=70)c="Balanced";else if(r[0][1]>=75&&r[1][1]>=70&&r[0][1]-r[1][1]<=7)c="Hybrid";A.innerHTML='<div class="logo">AXIORA</div><h1>Your Profile</h1><h2>'+c+'</h2>'+r.map(x=>'<p><b>'+x[0]+'</b>: '+x[1].toFixed(2)+'</p>').join('')+'<h3>F8: '+f8.toFixed(2)+'</h3><div class="note">AXIORA V1.0 is a working prototype, not a scientifically validated psychological assessment.</div><button class="primary" onclick="home()">Start Again</button>'}home();
</script></body></html>
